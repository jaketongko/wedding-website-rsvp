# `public/` is served as-is and every other path is handled by the `inject` edge
# function, which declares its own routing in netlify/edge-functions/inject.ts.
#
# The one build step resizes the Our Story photos in source-images/our-story/
# and the slideshow photos in source-images/slideshow/ into public/ and lists
# them for the edge function (scripts/story-photos.mjs).
# `netlify deploy --build` runs it locally before every deploy.

[build]
  command = "node scripts/story-photos.mjs"
  publish = "public"
  edge_functions = "netlify/edge-functions"

[[headers]]
  for = "/_wedding/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, immutable"
